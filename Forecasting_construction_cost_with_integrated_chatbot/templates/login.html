{% extends 'base.html' %}
{% block title %}User Login | CostForge{% endblock %}

{% block content %}
<div class="auth-wrap">
    <section class="panel auth-card">
        <p class="eyebrow">User access</p>
        <h1>Login</h1>
        {% for message in messages %}<div class="alert alert-{{ message.tags }}">{{ message }}</div>{% endfor %}
        <form method="POST" action="{% url 'UserLoginCheck' %}" class="stack">
            {% csrf_token %}
            <div><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="email" required></div>
            <div><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <p class="auth-foot">New user? <a href="{% url 'UserRegister' %}">Register</a></p>
    </section>
</div>
{% endblock %}
