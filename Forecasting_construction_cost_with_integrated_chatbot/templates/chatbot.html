{% extends 'users/userbase.html' %}
{% block title %}AI Assistant | CostForge{% endblock %}

{% block content %}
<section class="panel chat chat-container">
    <div class="panel-head" style="margin-bottom:.7rem">
        <h1 style="font-size:1.25rem;margin:0"><i class="fas fa-robot" style="color:var(--accent)"></i> Construction AI Assistant</h1>
    </div>
    <div id="chatBox" class="chat-box" aria-live="polite"></div>
    <div class="quick-prompts">
        <button type="button">Start prediction</button>
        <button type="button">Bridge rate on a hill station</button>
        <button type="button">Masons near Hyderabad</button>
        <button type="button">Average cost in Delhi</button>
        <button type="button">How accurate is the model?</button>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" maxlength="500" placeholder="Ask about construction cost..." aria-label="Your message">
        <button type="button" class="btn btn-primary" id="sendButton" aria-label="Send"><i class="fas fa-paper-plane"></i></button>
    </div>
</section>

<script>
const chatBox = document.getElementById("chatBox");
const inputField = document.getElementById("userInput");

// Text is added with textContent so messages can never inject HTML; only **bold** is formatted
function addMessage(text, sender) {
    const bubble = document.createElement("div");
    bubble.className = `message ${sender}`;
    bubble.style.whiteSpace = "pre-line";
    text.split(/\*\*(.+?)\*\*/s).forEach((part, index) => {
        const node = index % 2 ? document.createElement("strong") : document.createElement("span");
        node.textContent = part;
        bubble.appendChild(node);
    });
    chatBox.appendChild(bubble);
    chatBox.scrollTop = chatBox.scrollHeight;
    return bubble;
}

async function sendMessage(text) {
    const message = (text ?? inputField.value).trim();
    if (!message) return;
    addMessage(message, "user");
    inputField.value = "";
    const pending = addMessage("Thinking…", "bot");
    let reply;
    try {
        const response = await fetch(`{% url 'chatbot' %}?message=${encodeURIComponent(message)}`);
        if (response.status === 401) {
            reply = "Your session has ended. Please log in again.";
        } else if (!response.ok) {
            reply = "Something went wrong on the server. Please try again.";
        } else {
            reply = (await response.json()).response;
        }
    } catch (error) {
        reply = "I couldn't reach the server. Please check your connection and try again.";
    }
    pending.remove();
    addMessage(reply, "bot");
}

document.getElementById("sendButton").addEventListener("click", () => sendMessage());
inputField.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
});
document.querySelectorAll(".quick-prompts button").forEach((button) => {
    button.addEventListener("click", () => sendMessage(button.textContent));
});
addMessage("Hello! 👋 Ask me anything about this project or construction: costs, site rates, nearby labour or materials. Say **start prediction** for a guided estimate.", "bot");
</script>
{% endblock %}
