{% extends 'users/userbase.html' %}
{% load static %}

{% block content %}

<style>
    .chat-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 15px;
    }

    .chat-container {
        width: 100%;
        max-width: 720px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(15px);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }

    .chat-title {
        text-align: center;
        color: #333;
        font-weight: 600;
        margin-bottom: 15px;
    }

    .chat-box {
        height: 450px;
        overflow-y: auto;
        background: #ffffff;
        border-radius: 15px;
        padding: 15px;
        box-shadow: inset 0 2px 8px rgba(0,0,0,0.1);
    }

    .message {
        margin-bottom: 10px;
        padding: 10px 15px;
        border-radius: 20px;
        max-width: 85%;
        animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
        from {opacity: 0; transform: translateY(10px);}
        to {opacity: 1; transform: translateY(0);}
    }

    .user {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        margin-left: auto;
        text-align: right;
    }

    .bot {
        background: #e9ecef;
        color: #333;
        margin-right: auto;
        text-align: left;
    }

    .quick-prompts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 12px;
    }

    .quick-prompts button {
        border: 1px solid #667eea;
        background: white;
        color: #4c5fd5;
        border-radius: 15px;
        padding: 4px 12px;
        font-size: 0.8rem;
    }

    .input-area {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    .input-area input {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #ccc;
        outline: none;
    }

    .input-area input:focus {
        border-color: #667eea;
    }

    .input-area button {
        padding: 12px 18px;
        border: none;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
    }

    .input-area button:hover {
        transform: scale(1.05);
    }
</style>

<div class="chat-wrapper">

    <div class="chat-container">

        <h4 class="chat-title">🤖 Construction AI Assistant</h4>

        <div id="chatBox" class="chat-box" aria-live="polite"></div>

        <div class="quick-prompts">
            <button type="button">Start prediction</button>
            <button type="button">Bridge rate on a hill station</button>
            <button type="button">Masons near Hyderabad</button>
            <button type="button">Average cost in Delhi</button>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" maxlength="500" placeholder="Ask about construction cost..." aria-label="Your message">
            <button type="button" id="sendButton" aria-label="Send"><i class="fas fa-paper-plane"></i></button>
        </div>

    </div>

</div>

<script>
const chatBox = document.getElementById("chatBox");
const inputField = document.getElementById("userInput");

// Text is added with textContent so messages can never inject HTML; only **bold** is formatted
function addMessage(text, sender) {
    const bubble = document.createElement("div");
    bubble.className = `message ${sender}`;
    bubble.style.whiteSpace = "pre-line";
    text.split(/\*\*(.+?)\*\*/s).forEach((part, index) => {
        const node = index % 2 ? document.createElement("strong") : document.createElement("span");
        node.textContent = part;
        bubble.appendChild(node);
    });
    chatBox.appendChild(bubble);
    chatBox.scrollTop = chatBox.scrollHeight;
    return bubble;
}

async function sendMessage(text) {
    const message = (text ?? inputField.value).trim();
    if (!message) return;
    addMessage(message, "user");
    inputField.value = "";
    const pending = addMessage("Thinking…", "bot");
    let reply;
    try {
        const response = await fetch(`{% url 'chatbot' %}?message=${encodeURIComponent(message)}`);
        if (response.status === 401) {
            reply = "Your session has ended. Please log in again.";
        } else if (!response.ok) {
            reply = "Something went wrong on the server. Please try again.";
        } else {
            reply = (await response.json()).response;
        }
    } catch (error) {
        reply = "I couldn't reach the server. Please check your connection and try again.";
    }
    pending.remove();
    addMessage(reply, "bot");
}

document.getElementById("sendButton").addEventListener("click", () => sendMessage());
inputField.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
});
document.querySelectorAll(".quick-prompts button").forEach((button) => {
    button.addEventListener("click", () => sendMessage(button.textContent));
});
addMessage("Hello! 👋 Ask me about costs, site rates or nearby labour, or say **start prediction**.", "bot");
</script>

{% endblock %}
