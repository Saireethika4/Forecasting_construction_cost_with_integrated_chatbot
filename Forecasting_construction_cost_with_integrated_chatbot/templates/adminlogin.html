{% extends 'base.html' %}
{% block title %}Admin Login | CostForge{% endblock %}

{% block content %}
<div class="auth-wrap">
    <section class="panel auth-card">
        <p class="eyebrow">Restricted</p>
        <h1>Admin Login</h1>
        {% for message in messages %}<div class="alert alert-{{ message.tags }}">{{ message }}</div>{% endfor %}
        <form method="POST" action="{% url 'AdminLoginCheck' %}" class="stack">
            {% csrf_token %}
            <div><label for="loginid">Login ID</label><input type="text" id="loginid" name="loginid" autocomplete="username" required></div>
            <div><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <p class="auth-foot">Not an admin? <a href="{% url 'UserLogin' %}">Login as User</a></p>
    </section>
</div>
{% endblock %}
