{% extends 'base.html' %}
{% load static %}

{% block title %}User Register | Construction Cost Estimator{% endblock %}

{% block content %}
<style>
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: 'Segoe UI', sans-serif;
  }

  .login-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  .login-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(18px);
    border-radius: 16px;
    padding: 1.6rem;
    width: 100%;
    max-width: 330px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    color: #fff;
  }

  .login-card h3 {
    text-align: center;
    font-size: 1.1rem;
  }

  .form-control {
    border-radius: 7px;
    padding: 6px 10px;
    margin-bottom: 0.6rem;
    font-size: 0.85rem;
  }

  .btn-primary {
    width: 100%;
    padding: 7px;
    border-radius: 7px;
    font-weight: bold;
  }
</style>

<div class="login-container">
  <div class="login-card">

    <h3><i class="fas fa-user-plus"></i> Register</h3>

    <!-- ✅ IMPORTANT enctype added -->
    <form method="POST" action="{% url 'UserRegisterForm' %}" enctype="multipart/form-data">
      {% csrf_token %}

      <input type="text" name="name" class="form-control" placeholder="Full Name" required>

      <!-- ✅ NEW FIELD -->
      <input type="text" name="loginid" class="form-control" placeholder="Login ID" required>

      <input type="email" name="email" class="form-control" placeholder="Email" required>

      <input type="password" name="password" class="form-control" placeholder="Password" required>

      <input type="text" name="mobile" class="form-control" placeholder="Mobile" required>

      <input type="text" name="locality" class="form-control" placeholder="Locality" required>

      <input type="text" name="address" class="form-control" placeholder="Address" required>

      <!-- ✅ IMAGE UPLOAD -->
      <input type="file" name="image" class="form-control">

      <button type="submit" class="btn btn-primary">Register</button>
    </form>

    <div class="small text-center mt-2">
      Already have an account? 
      <a href="{% url 'UserLoginCheck' %}" style="color:#ffd54f;">Login</a>
    </div>

  </div>
</div>

{% endblock %}
